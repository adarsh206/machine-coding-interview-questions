<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Form</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            background-color: #0f1c23;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .circle-wrapper{
            position: relative;
            width: 320px;
            height: 320px;
        }

        .rotating-border{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#00f5ff 0deg, #0f1c2e 40deg, #0f1c2e 260deg);
            animation: spin 4s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }

        .login-box{
            position: relative;
            top: 15px;
            left: 15px;
            width: 290px;
            height: 290px;
            background: #131e32;
            border-radius: 50%;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            color: #fff;
            z-index: 2;
        }
        .login-box h2{
            margin-bottom: 20px;
            color: #00f5ff;
        }
        .login-box input{
            width: 90%;
            padding: 10px;
            margin: 10px auto;
            border: none;
            border-radius: 20px;
            background: #1e2b45;
            color: white;
            outline: none;
            text-align: center;
        }
        .login-box .forget{
            color: #999;
            font-size: 12px;
            margin: 5px 0;
            display: inline-block;
            text-decoration: none;
        }

        .login-box button{
            margin-top: 10px;
            padding: 10px 30px;
            border: none;
            background: #00f5ff;
            color: #000;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .login-box button:hover{
            background: #02cfd1;
        }

        .signup{
           margin-top: 10px;
           color: #aaa;
           font-size: 14px;
           cursor: pointer;
        }

        .back-container{
            margin-top: 30px;
            position: relative;
            padding: 2px;
            width: 150px;
            height: 30px;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: black;
        }
        .back-animate{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,#9b0c83, #00f5ff,  #13ca0d);
            animation: spin 5s linear infinite;
            z-index: 1;
            overflow: hidden;
        }
        .back{
            z-index: 2;
            position: relative;
            padding: 2px;
            width: 95%;
            height: 90%;
            color: white;
            left: 1px;
            justify-content: center;
            align-items: center;
            background: black;
        }
        .back-button{
            width: 95%;
            height: 90%;
            background: black;
            color: white; 
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="circle-wrapper">
        <div class="rotating-border"></div>
        <div class="login-box">
            <h2>Login</h2>
            <form>
                <input type="email" placeholder="Email" required />
                <input type="password" placeholder="Password" required />
                <a href="#" class="forget">Forget Your Password</a><br>
                <button type="submit">Login</button>
                <a class="signup">Signup</a>
            </form>
        </div>
    </div>

    <div class="back-container">
        <div class="back-animate"></div>
        <div class="back">
            <button class="back-button">Back</button>
        </div>
        
    </div>
    
</body>
</html>
